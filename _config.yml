title: Data Founders
description: London-based data and AI consultancy helping growth-focused SMEs build data strategy, data teams and AI roadmaps that deliver measurable outcomes.
logo: /assets/data_founders_logo.png
lang: en_GB
social:
  name: Data Founders
  links:
    - https://www.linkedin.com/company/datafounders
baseurl: ""
url: "https://datafounders.co.uk"
email: hello@datafounders.co.uk

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# Blog settings
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
    sort_by: date
    sort_order: descending

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Adam Dathi"
      share: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      image: /assets/data_founders_logo.png

# Permalinks
permalink: pretty

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Timezone
timezone: Europe/London

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .bundle
  - .git
  - .gitignore
