---
layout: default
---
<article class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16">
    <header class="mb-10">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4" style="font-family: 'Source Serif Pro', Georgia, serif; letter-spacing: -0.025em;">{{ page.title }}</h1>
        {% if page.updated %}
            <p class="text-sm text-gray-500">Last updated {{ page.updated | date: "%-d %B %Y" }}</p>
        {% endif %}
    </header>

    <div class="prose prose-lg max-w-none">
        {{ content }}
    </div>
</article>
